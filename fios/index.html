<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fios · Guilherme Dias</title>
  <meta name="description" content="Experimento de tempo livre: uma marionete em WebGL, com fios que você puxa." />
  <meta name="theme-color" content="#0A0A0B" />

  <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fios/fios.css" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0A0B'/><circle cx='16' cy='16' r='5' fill='%23F2A5B5'/></svg>" />

  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <main class="stage" id="stage">
    <h1 class="word" id="word" aria-label="Fios"><span>F</span><span>i</span><span>o</span><span>s</span></h1>

    <!-- versão parada: sem JS, sem WebGL ou com movimento reduzido -->
    <div class="still">
      <svg class="still-threads" viewBox="0 0 823 1407" aria-hidden="true">
        <line x1="100" y1="660" x2="-19" y2="-1400" />
        <line x1="225" y1="180" x2="131" y2="-1400" />
        <line x1="325" y1="1010" x2="120" y2="-1400" />
        <line x1="350" y1="35" x2="371" y2="-1400" />
        <line x1="437" y1="150" x2="481" y2="-1400" />
        <line x1="470" y1="1010" x2="620" y2="-1400" />
        <line x1="510" y1="185" x2="691" y2="-1400" />
        <line x1="700" y1="650" x2="881" y2="-1400" />
      </svg>
      <img src="/fios/casaco.webp" width="823" height="1407" decoding="async" alt="" />
      <img src="/fios/corpo.webp" width="823" height="1407" decoding="async" alt="Guilherme de terno bordô, óculos escuros e casaco de penas rosa, pendurado por fios como uma marionete enquanto tira uma selfie." />
    </div>

    <canvas class="layer" id="back" aria-hidden="true"></canvas>
    <canvas class="layer" id="puppet" aria-hidden="true"></canvas>
    <canvas class="layer" id="threads" aria-hidden="true"></canvas>

    <a class="back" href="/#experimentos">← voltar pro site</a>

    <div class="controls">
      <button class="control" id="sound" type="button" aria-pressed="true">som: ligado</button>
      <button class="control control-cage" id="cage" type="button">fechar a gaiola</button>
    </div>

    <p class="hint" id="hint" aria-live="polite">Puxa um fio.</p>

    <p class="credit">Imagem gerada com IA. Roupa inspirada no Doflamingo, de One Piece.</p>
  </main>

  <script src="/fios/fios.js" onerror="document.documentElement.classList.remove('js')"></script>
</body>
</html>
